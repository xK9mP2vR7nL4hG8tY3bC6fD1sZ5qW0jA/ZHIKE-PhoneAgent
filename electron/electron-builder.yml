appId: com.zhike.phoneagent
productName: ZHIKE-PhoneAgent
copyright: Copyright © 2026 ZHIKE

artifactName: ZHIKE-PhoneAgent-${version}-${arch}.${ext}

# 发布到 GitHub Releases
# 不使用 electron-builder 内置 publish（Windows 上大文件上传容易超时）。
# 产物通过 `gh release upload` 在 Release 工作流中单独上传。
publish: null

# 启用更新元数据生成
electronUpdaterCompatibility: ">=2.16"

# 打包后设置可执行权限
afterPack: ./afterPack.js

directories:
  output: dist
  buildResources: build

files:
  - "main.js"
  - "preload.js"
  - "afterPack.js"
  - "package.json"
  # Splash 资源：splash.html / splash-logo.png 由 electron-builder 默认包含
  # （不显式列出以兼容 Windows 构建）
  # 不显式配置 node_modules，让 electron-builder 自动从 dependencies 中包含运行时依赖

extraResources:
  - from: ../resources/backend
    to: backend
  - from: ../resources/adb
    to: adb

win:
  target:
    - nsis       # 安装包（推荐）
    - portable   # 便携版
  icon: icon.ico
  # 禁用 Windows 代码签名：当前仓库无签名证书，signtool.exe 会失败
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false  # 用户级安装，无需管理员权限

mac:
  target:
    - dmg
  icon: icon.icns
  category: public.app-category.developer-tools
  # 开发阶段不签名，使用 xattr -cr 移除隔离属性
  identity: null

dmg:
  # 启用 writeUpdateInfo 生成 latest-mac.yml（自动更新必需）
  writeUpdateInfo: true
  format: UDZO
  sign: false
  internetEnabled: false


linux:
  target:
    - AppImage    # 最通用的格式，无需安装
    - tar.gz      # 便携版
    # deb 暂时移除：需要 ZHIKE 官方维护者邮箱后恢复
  category: Development
  icon: icon.png
